# Installed by cm4/fpga-manager as /etc/systemd/system/pvtd.service.d/fpga-manager.conf.
# While another project is loaded, fpga-flash creates this flag; pvtd must not
# start then (its 90 s watchdog would reflash the playground over that project).
[Unit]
ConditionPathExists=!/run/fpga-manager/foreign-bitstream
